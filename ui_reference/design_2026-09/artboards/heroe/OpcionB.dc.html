<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      background: #14150F;
      color: #E5E2D9;
      font-family: "Google Sans Flex Text", "Google Sans", system-ui, sans-serif;
      font-size: 20.8px;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    .etq { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #C5C8B6; }
    .display { font-family: "Google Sans Flex Display", system-ui, sans-serif; font-weight: 300; line-height: 1; }
    .clave { font-size: 15px; font-weight: 600; color: #C5C8B6; }
    .valor { font-size: 21px; font-weight: 600; }
  </style>
</helmet>

<div style="width: 640px; height: 620px; background: #1C1D17; border-radius: 28px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <div class="etq" style="flex-grow: 1;">Q1 Julio 2026 &middot; del 1 al 15</div>
    <div style="font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: #005233; color: #92F7B4;">Dia 7 de 15</div>
  </div>

  <!-- El anillo se queda, pero deja de ser un solo arco: ahora son los tres pedazos -->
  <div style="display: flex; align-items: center; gap: 22px;">
    <div style="position: relative; width: 250px; height: 250px; flex-shrink: 0;">
      <svg width="250" height="250" viewBox="0 0 250 250" style="transform: rotate(-90deg);">
        <circle cx="125" cy="125" r="104" fill="none" stroke="#2A2B22" stroke-width="26"/>
        <circle cx="125" cy="125" r="104" fill="none" stroke="#FFB4AB" stroke-width="26"
                stroke-dasharray="145 653" stroke-dashoffset="0" stroke-linecap="butt"/>
        <circle cx="125" cy="125" r="104" fill="none" stroke="#6E6B4F" stroke-width="26"
                stroke-dasharray="26 653" stroke-dashoffset="-155" stroke-linecap="butt"/>
        <circle cx="125" cy="125" r="104" fill="none" stroke="#92F7B4" stroke-width="26"
                stroke-dasharray="467 653" stroke-dashoffset="-186" stroke-linecap="butt"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <div class="etq" style="font-size: 12px;">Te queda</div>
        <div class="display" style="font-size: 44px; color: #92F7B4;">$54,206</div>
        <div class="clave" style="font-size: 14px;">72 de cada 100</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">
      <div>
        <div class="etq">Entro</div>
        <div class="display" style="font-size: 32px; margin-top: 4px;">$75,000</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 14px; height: 14px; border-radius: 4px; background: #FFB4AB; flex-shrink: 0;"></div>
        <div style="flex-grow: 1;"><div class="valor">Gastado</div></div>
        <div class="valor">$17,223</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 14px; height: 14px; border-radius: 4px; background: #6E6B4F; flex-shrink: 0;"></div>
        <div style="flex-grow: 1;"><div class="valor">Apartado</div></div>
        <div class="valor">$3,571</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 14px; height: 14px; border-radius: 4px; background: #92F7B4; flex-shrink: 0;"></div>
        <div style="flex-grow: 1;"><div class="valor" style="color: #92F7B4;">Libre</div></div>
        <div class="valor" style="color: #92F7B4;">$54,206</div>
      </div>
    </div>
  </div>

  <div style="height: 1px; background: #2A2B22;"></div>

  <div style="display: flex; align-items: center; gap: 12px; background: #202118; border-radius: 18px; padding: 14px 18px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C5C8B6" stroke-width="2.2" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9.2"/><path d="M12 7.6V12l3 2"/></svg>
    <div class="clave" style="flex-grow: 1; line-height: 1.3;">Lo apartado son 6 pagos planeados que aun no se ejecutan. Tocalo para verlos.</div>
  </div>

</div>
</x-dc>
</body>
</html>
