<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      background: #14150F;
      color: #E5E2D9;
      font-family: "Google Sans Flex Text", "Google Sans", system-ui, sans-serif;
      font-size: 20.8px;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    .etq { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #C5C8B6; }
    .display { font-family: "Google Sans Flex Display", system-ui, sans-serif; font-weight: 300; line-height: 1; }
    .renglon { display: flex; align-items: baseline; gap: 14px; }
    .signo { width: 34px; font-size: 26px; font-weight: 600; color: #8B8E7C; flex-shrink: 0; text-align: center; }
    .concepto { font-size: 19px; font-weight: 600; flex-grow: 1; }
    .detalle { font-size: 15px; font-weight: 500; color: #C5C8B6; }
  </style>
</helmet>

<div style="width: 640px; height: 620px; background: #1C1D17; border-radius: 28px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <div class="etq" style="flex-grow: 1;">Q1 Julio 2026 &middot; del 1 al 15</div>
    <div style="font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: #005233; color: #92F7B4;">Dia 7 de 15</div>
  </div>

  <!-- Sin anillo y sin barra: la resta escrita como resta -->
  <div style="display: flex; flex-direction: column; gap: 18px;">

    <div class="renglon">
      <div class="signo"></div>
      <div>
        <div class="concepto">Entro</div>
        <div class="detalle">Sueldos de Norma y Benjamin</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div class="display" style="font-size: 34px;">$75,000</div>
    </div>

    <div class="renglon">
      <div class="signo">&minus;</div>
      <div>
        <div class="concepto">Gastado</div>
        <div class="detalle">16 movimientos ejecutados</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div class="display" style="font-size: 34px; color: #FFB4AB;">$17,223</div>
    </div>

    <div class="renglon">
      <div class="signo">&minus;</div>
      <div>
        <div class="concepto">Apartado</div>
        <div class="detalle">6 pagos planeados que aun no salen</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div class="display" style="font-size: 34px; color: #C9C5A0;">$3,571</div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <div class="signo"></div>
      <div style="flex-grow: 1; height: 2px; background: #3A3B30;"></div>
    </div>

    <div class="renglon">
      <div class="signo" style="color: #92F7B4;">=</div>
      <div>
        <div class="concepto" style="color: #92F7B4;">Puedes gastar</div>
        <div class="detalle">$6,775 al dia en los 8 dias que faltan</div>
      </div>
      <div style="flex-grow: 1;"></div>
      <div class="display" style="font-size: 54px; color: #92F7B4;">$54,206</div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <!-- El barra pequenia ya no explica: solo situa. La explicacion es la resta de arriba. -->
  <div style="display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: #2A2B22;">
    <div style="width: 23%; background: #FFB4AB;"></div>
    <div style="width: 5%; background: #6E6B4F;"></div>
    <div style="flex-grow: 1; background: #92F7B4;"></div>
  </div>

</div>
</x-dc>
</body>
</html>
