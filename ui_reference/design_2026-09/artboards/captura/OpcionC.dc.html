<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      background: #14150F;
      color: #E5E2D9;
      font-family: "Google Sans Flex Text", "Google Sans", "Product Sans", system-ui, sans-serif;
      font-size: 20.8px;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #77DA9A; }
    a:hover { color: #92F7B4; }
    .etq {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #C5C8B6;
    }
    .sugerencia {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 0 18px;
      border-radius: 20px;
      background: #202118;
    }
    .sugerencia .monto {
      font-family: 'Google Sans Flex Display', system-ui, sans-serif;
      font-weight: 300;
      font-size: 32px;
      color: #E5E2D9;
      white-space: nowrap;
    }
    .redondo {
      width: 48px; height: 48px; border-radius: 999px;
      background: #005233; display: grid; place-items: center; flex: none;
    }
  </style>
</helmet>

<div style="width: 640px; height: 900px; display: flex; flex-direction: column; background: #1C1D17; border-radius: 28px 28px 0 0; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 20px 16px 20px;">
    <div style="width: 48px; height: 48px; border-radius: 999px; background: #2A2B22; display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E2D9" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div class="etq">Nuevo movimiento</div>
      <div style="font-family: 'Google Sans Flex Display', system-ui, sans-serif; font-weight: 300; font-size: 30px; line-height: 1.1;">¿Qué gastaste?</div>
    </div>
  </div>

  <!-- El caso comun es repetir. Se ofrece el gasto entero, no sus partes. -->
  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 12px;">
    <div class="etq">Lo que sueles gastar a esta hora</div>

    <div class="sugerencia">
      <div class="redondo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#92F7B4" stroke-width="2" stroke-linecap="round"><path d="M3 9h18M5 9V6a2 2 0 012-2h10a2 2 0 012 2v3M5 9v9a2 2 0 002 2h10a2 2 0 002-2V9"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 20px; font-weight: 600;">Despensa</div>
        <div style="font-size: 16px; font-weight: 500; color: #C5C8B6;">Banamex &middot; toda la familia</div>
      </div>
      <div class="monto">$1,950</div>
    </div>

    <div class="sugerencia">
      <div class="redondo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#92F7B4" stroke-width="2" stroke-linecap="round"><path d="M5 17V9l2-4h7l2 4v8M5 17h11M5 17v2M16 17v2M18 9h2a1.5 1.5 0 011.5 1.5V15"/><circle cx="8" cy="13.5" r="1"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 20px; font-weight: 600;">Gasolina</div>
        <div style="font-size: 16px; font-weight: 500; color: #C5C8B6;">Efectivo &middot; Norma</div>
      </div>
      <div class="monto">$1,400</div>
    </div>

    <div class="sugerencia">
      <div class="redondo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#92F7B4" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="13" rx="2.5"/><path d="M10 9.5l5 3-5 3z"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 20px; font-weight: 600;">Netflix</div>
        <div style="font-size: 16px; font-weight: 500; color: #C5C8B6;">Banamex Clásica &middot; toda la familia</div>
      </div>
      <div class="monto">$329</div>
    </div>
  </div>

  <!-- Capturar algo distinto: monto primero, el resto se decide despues -->
  <div style="margin: 22px 20px 0 20px; padding: 20px; border-radius: 22px; background: #202118; display: flex; flex-direction: column; gap: 16px;">
    <div class="etq">Otra cosa</div>
    <div style="display: flex; align-items: baseline; gap: 12px;">
      <div style="font-family: 'Google Sans Flex Display', system-ui, sans-serif; font-weight: 300; font-size: 54px; line-height: 1; color: #8F9184;">$0</div>
      <div style="width: 3px; height: 46px; background: #77DA9A; align-self: center;"></div>
      <div style="flex-grow: 1;"></div>
      <div class="etq">MXN</div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="height: 52px; border-radius: 16px; background: #2A2B22; display: grid; place-items: center; font-size: 19px; font-weight: 600;">$50</div>
      <div style="height: 52px; border-radius: 16px; background: #2A2B22; display: grid; place-items: center; font-size: 19px; font-weight: 600;">$100</div>
      <div style="height: 52px; border-radius: 16px; background: #2A2B22; display: grid; place-items: center; font-size: 19px; font-weight: 600;">$500</div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- Dictar y escanear: los otros dos caminos que ya existen en la app -->
  <div style="display: flex; gap: 12px; padding: 0 20px 16px 20px;">
    <div style="flex-grow: 1; height: 56px; border-radius: 999px; background: #2A2B22; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E2D9" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      Dictar
    </div>
    <div style="flex-grow: 1; height: 56px; border-radius: 999px; background: #2A2B22; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E2D9" stroke-width="2" stroke-linecap="round"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16"/><path d="M4 12h16"/></svg>
      Escanear
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 16px; padding: 14px 20px 20px 20px; background: #202118;">
    <div style="flex-grow: 1; min-width: 0;">
      <div class="etq">Resumen</div>
      <div style="font-size: 18px; font-weight: 600; color: #C5C8B6;">Toca lo de siempre o teclea un monto</div>
    </div>
    <div style="height: 56px; padding: 0 30px; border-radius: 999px; background: #2A2B22; color: #8F9184; font-size: 19px; font-weight: 700; display: grid; place-items: center;">Guardar</div>
  </div>

</div>
</x-dc>
</body>
</html>
