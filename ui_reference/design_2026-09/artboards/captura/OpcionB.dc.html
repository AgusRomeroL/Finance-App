<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      background: #14150F;
      color: #E5E2D9;
      font-family: "Google Sans Flex Text", "Google Sans", "Product Sans", system-ui, sans-serif;
      font-size: 20.8px;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #77DA9A; }
    a:hover { color: #92F7B4; }
    .etq {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #C5C8B6;
    }
    .fila {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 0 18px;
      border-radius: 18px;
      background: #202118;
    }
    .fila .valor { font-size: 19px; font-weight: 600; color: #E5E2D9; }
    .fila .pendiente { font-size: 19px; font-weight: 600; color: #FFB95C; }
    .ico { width: 24px; height: 24px; flex: none; }
  </style>
</helmet>

<div style="width: 640px; height: 900px; display: flex; flex-direction: column; background: #1C1D17; border-radius: 28px 28px 0 0; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 14px; padding: 20px 20px 14px 20px;">
    <div style="width: 48px; height: 48px; border-radius: 999px; background: #2A2B22; display: grid; place-items: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E5E2D9" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div class="etq">Nuevo movimiento</div>
      <div style="font-family: 'Google Sans Flex Display', system-ui, sans-serif; font-weight: 300; font-size: 30px; line-height: 1.1;">Capturar gasto</div>
    </div>
    <div style="display: flex; background: #2A2B22; border-radius: 999px; padding: 4px;">
      <div style="padding: 10px 18px; border-radius: 999px; background: #93000A; color: #FFDAD6; font-size: 17px; font-weight: 700;">Gasto</div>
      <div style="padding: 10px 18px; border-radius: 999px; color: #C5C8B6; font-size: 17px; font-weight: 600;">Ingreso</div>
    </div>
  </div>

  <!-- Monto arriba, con el teclado del sistema. Sin teclado propio. -->
  <div style="margin: 0 20px 16px 20px; padding: 20px; border-radius: 22px; background: #202118; border-bottom: 3px solid #77DA9A; display: flex; align-items: baseline; gap: 12px;">
    <div style="font-family: 'Google Sans Flex Display', system-ui, sans-serif; font-weight: 300; font-size: 62px; line-height: 1; color: #E5E2D9;">$1,950</div>
    <div style="width: 3px; height: 52px; background: #77DA9A; align-self: center;"></div>
    <div style="flex-grow: 1;"></div>
    <div class="etq">MXN</div>
  </div>

  <!-- Una fila por decision. Cada una dice en que quedo. -->
  <div style="margin: 0 20px; display: flex; flex-direction: column; gap: 10px;">

    <div class="fila">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#C5C8B6" stroke-width="2" stroke-linecap="round"><path d="M3 9h18M5 9V6a2 2 0 012-2h10a2 2 0 012 2v3M5 9v9a2 2 0 002 2h10a2 2 0 002-2V9"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div class="etq">Categoría</div>
        <div class="valor">Despensa</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <div style="height: 40px; padding: 0 14px; border-radius: 999px; background: #2A2B22; color: #C5C8B6; font-size: 16px; font-weight: 600; display: grid; place-items: center;">Gasolina</div>
        <div style="height: 40px; padding: 0 14px; border-radius: 999px; background: #2A2B22; color: #C5C8B6; font-size: 16px; font-weight: 600; display: grid; place-items: center;">Netflix</div>
      </div>
    </div>

    <div class="fila">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#C5C8B6" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10.5h19"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div class="etq">Cuenta</div>
        <div class="valor">Banamex Clásica</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8F9184" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="fila">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#C5C8B6" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div class="etq">Quién consume</div>
        <div class="valor">Toda la familia</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8F9184" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="fila">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#C5C8B6" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4 8h8M20 16h-8"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div class="etq">Quién paga</div>
        <div class="valor">Norma</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8F9184" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="fila">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#C5C8B6" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <div style="flex-grow: 1; min-width: 0;">
        <div class="etq">Fecha</div>
        <div class="valor">Hoy, 15 sept</div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8F9184" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="fila" style="background: transparent;">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#8F9184" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg>
      <div style="flex-grow: 1;">
        <div style="font-size: 18px; font-weight: 600; color: #C5C8B6;">Nota, ubicación, pagó un tercero</div>
      </div>
    </div>

  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; gap: 16px; padding: 14px 20px 20px 20px; background: #202118;">
    <div style="flex-grow: 1; min-width: 0;">
      <div class="etq">Resumen</div>
      <div style="font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Despensa &middot; $1,950 &middot; Banamex</div>
    </div>
    <div style="height: 56px; padding: 0 30px; border-radius: 999px; background: #77DA9A; color: #002111; font-size: 19px; font-weight: 700; display: grid; place-items: center;">Guardar</div>
  </div>

</div>
</x-dc>
</body>
</html>
