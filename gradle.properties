org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
android.enableJetifier=true
# LiteRT-LM trae bytecode Java 21 (class major 65) que Jetifier no procesa; se
# excluye (es moderno, no necesita rewrite a AndroidX).
android.jetifier.ignorelist=litertlm-android
# Toolchain en Kotlin 2.2: ya no se necesita -Xskip-metadata-version-check y el
# incremental vuelve a ser estable.
kotlin.incremental=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# Version unica de la app: la leen :app y :wear. El emparejamiento companion del
# reloj exige el MISMO applicationId (mx.budget en los dos) y que el versionCode
# del reloj no quede por delante del telefono. Con una sola propiedad ese
# invariante es estructural: no hay dos numeros que se puedan desincronizar.
# La Fase 8 sube el release con un override, que afecta a los dos APK a la vez:
#   ./gradlew.bat -Pbudget.versionCode=2 -Pbudget.versionName=1.1 :app:assembleRelease :wear:assembleRelease
budget.versionCode=1
budget.versionName=1.0
