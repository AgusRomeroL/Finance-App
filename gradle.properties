org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
android.useAndroidX=true
android.enableJetifier=true
# LiteRT-LM trae bytecode Java 21 (class major 65) que Jetifier no procesa; se
# excluye (es moderno, no necesita rewrite a AndroidX).
android.jetifier.ignorelist=litertlm-android
# Toolchain en Kotlin 2.2: ya no se necesita -Xskip-metadata-version-check y el
# incremental vuelve a ser estable.
kotlin.incremental=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# Version unica de la app: la leen :app y :wear. El emparejamiento companion del
# reloj exige el MISMO applicationId (mx.budget en los dos) y que el versionCode
# del reloj no quede por delante del telefono. Con una sola propiedad ese
# invariante es estructural: no hay dos numeros que se puedan desincronizar.
#
# Esquema (Fase 8): versionCode = yyMMddNN, la fecha del build mas una secuencia
# de dos digitos para varios builds el mismo dia (26103101 = 2026-10-31, el
# primero). Siempre crece, cabe en un Int y queda por debajo del tope de Play
# (2100000000). versionName es semantico: MAYOR.MENOR.PARCHE.
# Cada release que se distribuye sube los dos aqui, en un commit propio; un APK
# instalado solo acepta una actualizacion con versionCode mayor. El detalle esta
# en CLAUDE.md, "Como se publica".
budget.versionCode=26103101
budget.versionName=1.0.0
